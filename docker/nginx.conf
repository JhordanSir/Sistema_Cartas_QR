map $http_x_forwarded_proto $sirio_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

# Dokploy puede conectar Nginx a redes compartidas que contienen otros servicios
# llamados "web". El alias solo existe en app_network y la resolución por petición
# evita conservar la IP de un contenedor recreado.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
  listen 80;
  listen [::]:80;
  server_name _;

  server_tokens off;
  client_max_body_size 16m;
  set $sirio_web_upstream web-internal:3000;

  location = /health {
    access_log off;
    proxy_pass http://$sirio_web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $sirio_forwarded_proto;
  }

  location / {
    proxy_pass http://$sirio_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $sirio_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
  }
}

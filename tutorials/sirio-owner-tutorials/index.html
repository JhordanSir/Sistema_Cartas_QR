<!DOCTYPE html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body { font-family: Arial, sans-serif; }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-txxr" id="root" data-composition-id="main" data-duration="6" data-width="1080" data-height="1920">
      <style>
        #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f7f1e7; color: #29271f; }
        .series-cover { position: absolute; inset: 0; padding: 160px 96px; background: #f7f1e7; }
        .series-cover::after { position: absolute; right: -160px; bottom: -160px; width: 640px; height: 640px; border: 2px solid rgba(183,91,56,.22); border-radius: 50%; box-shadow: 0 0 0 80px rgba(183,91,56,.04); content: ''; }
        .series-cover p { margin: 0; color: #315b45; font-size: 25px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
        .series-cover h1 { max-width: 800px; margin: 56px 0; font-size: 100px; letter-spacing: -.08em; line-height: .92; }
        .series-cover strong { display: inline-block; padding: 20px 26px; border-radius: 14px; background: #315b45; color: white; font-size: 30px; }
      </style>
      <section data-hf-id="hf-90a5" class="series-cover"><p data-hf-id="hf-t4ne">Sirio Automatiza</p><h1 data-hf-id="hf-i67c">Guías móviles para tu carta.</h1><strong data-hf-id="hf-r4pa">5 tutoriales · menos de 1 min</strong></section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('.series-cover h1', { autoAlpha: 0, y: 70 }, { autoAlpha: 1, y: 0, duration: .6, ease: 'power2.out', immediateRender: false }, 0);
      tl.fromTo('.series-cover strong', { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, duration: .45, ease: 'power2.out', immediateRender: false }, .4);

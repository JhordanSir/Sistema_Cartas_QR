# Override local. Dokploy usa exclusivamente compose.yml.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    ports:
      - "127.0.0.1:${API_PORT:-3001}:${API_PORT:-3001}"

  web:
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"

networks:
  data_network:
    internal: false
